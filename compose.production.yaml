name: magnificat-web

services:
  frontend:
    image: ${FRONTEND_IMAGE:-magnificat-frontend:local}
    build:
      context: .
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL to the browser-facing API URL including /api/v1}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    networks:
      - frontend
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(5000)}).then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"
      interval: 30s
      timeout: 7s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s

networks:
  frontend:
    name: ${FRONTEND_NETWORK:-magnificat-frontend}
    driver: bridge
